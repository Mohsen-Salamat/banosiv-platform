name: Restore canonical BANOSIV source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preserve this workflow
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/restore-workflow

          cp .github/workflows/restore-canonical.yml \
             /tmp/restore-workflow/restore-canonical.yml

      - name: Restore canonical source without CI workflow
        shell: bash
        run: |
          set -euo pipefail

          test -f BANOSIV-platform-foundation.tar.gz

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name BANOSIV-platform-foundation.tar.gz \
            -exec rm -rf {} +

          tar -xzf BANOSIV-platform-foundation.tar.gz \
            --strip-components=1 \
            -C .

          rm -rf .github
          mkdir -p .github/workflows

          cp /tmp/restore-workflow/restore-canonical.yml \
             .github/workflows/restore-canonical.yml

          rm -f BANOSIV-platform-foundation.tar.gz

      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "restore: canonical BANOSIV source"
          git push origin HEAD:main
